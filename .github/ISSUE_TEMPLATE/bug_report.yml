name: Bug report
description: Report a reproducible PocketStream problem without private data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload the full SD-card application directory or raw logs. Remove search terms, video IDs, IP/MAC addresses, Wi-Fi data, usernames, and local paths. Security vulnerabilities belong in the private Security reporting form, not here.
  - type: input
    id: version
    attributes:
      label: PocketStream version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: onion
    attributes:
      label: OnionOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a generic search phrase if a query is relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
