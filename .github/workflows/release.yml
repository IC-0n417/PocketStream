name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          check-latest: true
      - name: Build and test
        run: sh scripts/build-armv7.sh
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/... ./internal/...
      - name: Package
        run: sh scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="build/release/PocketStream-OnionOS-${GITHUB_REF_NAME#v}.zip"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --verify-tag --generate-notes --title "PocketStream ${GITHUB_REF_NAME#v}"
